<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarkov Wayfinder</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
  :root {
    --bg: #0e1317; --panel: #141b20; --panel2: #1a242a; --line: #25323a; --text: #e5eae7; --dim: #8b989e;
    --brass: #cdb57d; --you: #ff4d79;
    --display: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--body); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  #app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

  /* header */
  .head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(#18222a, var(--panel)); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font: 600 21px/1 var(--display); letter-spacing: .02em; }
  .brand small { color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  select, button, input[type=text] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font: inherit; }
  select { flex: 1; min-width: 0; font: 600 15px var(--display); }
  button { cursor: pointer; transition: background .12s, border-color .12s; }
  button:hover { border-color: #3a4b55; background: #20303a; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--panel2); padding: 6px 14px; font-weight: 600; }
  .seg button.on { background: var(--brass); color: #16130b; }
  button.sm { padding: 2px 9px; font-size: 12px; border-radius: 6px; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; cursor: pointer; }
  label.chk input { accent-color: var(--brass); }
  .summary { margin-top: 10px; color: var(--dim); font-size: 12.5px; }
  .summary b { color: #5fd38d; font-weight: 600; }

  /* where am I */
  #you { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); background: var(--panel); }
  #you b { color: var(--text); font-weight: 600; }
  #you .hint { display: block; margin-top: 3px; }
  .pos { display: flex; align-items: center; gap: 10px; }
  .pos .num { font: 600 15px var(--display); color: var(--text); letter-spacing: .02em; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--you); flex: none; box-shadow: 0 0 0 3px rgba(255,77,121,.2); }
  .live.old { background: #5b6870; box-shadow: none; }
  #route { margin-top: 8px; padding: 7px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  #route .t { flex: 1; min-width: 0; }
  #route .go { color: #5fd38d; font-weight: 600; }

  /* tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 10px 2px 9px; border-bottom: 2px solid transparent; font: 600 12.5px var(--display); letter-spacing: .01em; display: inline-flex; gap: 5px; white-space: nowrap; align-items: center; justify-content: center; }
  .tabs button:hover { background: transparent; color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--brass); }

  /* list */
  #list { flex: 1; overflow: auto; padding: 4px 0 10px; scrollbar-width: thin; scrollbar-color: #2d3c45 transparent; }
  .sec { display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px; font: 600 13px var(--display); letter-spacing: .02em; color: var(--text); }
  .sec .cnt { font: 600 11px var(--body); color: var(--dim); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; }
  .sec.warn { color: #f29b50; }
  .ex, .qrow { display: flex; gap: 11px; padding: 8px 16px; cursor: pointer; align-items: flex-start; border-left: 3px solid transparent; }
  .ex:hover, .qrow:hover { background: #1a252c; }
  .ex.tgt { background: #1d2c35; border-left-color: var(--brass); }
  .badge { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--c); background: #0f1519; box-shadow: inset 0 0 0 2px var(--c); flex: none; }
  .t { flex: 1; min-width: 0; }
  .n { color: var(--text); font-weight: 600; }
  .s { color: var(--dim); font-size: 12px; }
  .note { color: var(--brass); font-size: 12px; font-style: italic; }
  .d { color: var(--text); font: 600 13px var(--display); white-space: nowrap; text-align: right; }
  .d small { display: block; color: var(--dim); font: 400 11.5px var(--body); }
  .card { margin: 10px 16px 4px; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--dim); }
  .qobj { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .qobj.q-opt { opacity: .65; }
  footer { padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11px; color: #6f7d83; line-height: 1.4; }
  footer a { color: #8b989e; }

  /* map */
  main { position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; background: #0b0f12; }
  .leaflet-container { background: #0b0f12; font-family: var(--body); }
  .leaflet-image-layer { z-index: 1 !important; } /* canvas markers (loot, spawns, quest zones) draw above the map art */
  .leaflet-bar a, .leaflet-bar a:hover { background: var(--panel2); color: var(--text); border-bottom-color: var(--line); }
  .leaflet-bar { border: 1px solid var(--line); box-shadow: none; }

  .tip.leaflet-tooltip { background: #10171c; border: 1px solid #2c3b44; color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.45); padding: 5px 9px; border-radius: 7px; font-size: 12.5px; }
  .tip.leaflet-tooltip::before { display: none; }
  .tip b { font-weight: 600; }
  .tip .k { display: block; color: var(--dim); font-size: 11.5px; }
  .tip.flag.leaflet-tooltip { background: rgba(14,19,23,.82); border-color: #2c3b44; padding: 1px 7px; font-weight: 600; }

  /* markers */
  .mk { display: grid; place-items: center; border-radius: 50%; background: #0f1519; color: var(--c); box-shadow: inset 0 0 0 2px var(--c), 0 1px 6px rgba(0,0,0,.7); }
  .mk.safe { box-shadow: inset 0 0 0 2.5px var(--c), 0 0 0 5px color-mix(in srgb, var(--c) 22%, transparent), 0 1px 8px rgba(0,0,0,.75); }
  .mk.hex { border-radius: 0; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); background: var(--c); color: #0f1519; box-shadow: none; }
  .mk.sq { border-radius: 6px; }
  .ring { border-radius: 50%; border: 2px solid #fff; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.55); opacity: .95; } 100% { transform: scale(1.5); opacity: 0; } }
  .you-wrap { filter: drop-shadow(0 2px 5px rgba(0,0,0,.8)); }
  .you-wrap svg { transition: transform .2s; }
  .pulse-you { animation: pulse 2.2s ease-out infinite; transform-origin: 32px 32px; }
  @media (prefers-reduced-motion: reduce) { .ring, .pulse-you, .you-wrap svg { animation: none; transition: none; } }

  /* floating legend + scale */
  #legend { position: absolute; left: 12px; bottom: 12px; z-index: 800; background: rgba(16,23,28,.92); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; max-width: 220px; }
  #legend summary { cursor: pointer; font: 600 13px var(--display); letter-spacing: .02em; list-style: none; }
  #legend summary::-webkit-details-marker { display: none; }
  #legend ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; }
  #legend li { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  #scale { position: absolute; right: 14px; bottom: 12px; z-index: 800; color: var(--text); font: 600 12px var(--display); text-align: center; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #scale i { display: block; height: 6px; border: 2px solid var(--text); border-top: 0; margin-top: 3px; filter: drop-shadow(0 1px 1px #000); }
  #timer .big { font: 600 22px var(--display); letter-spacing: .03em; }
  #timer .big.low { color: #ff6b5e; }
  #timer .s { flex: 1; }
  .tog { display: flex; align-items: center; gap: 10px; padding: 7px 16px; cursor: pointer; }
  .tog:hover { background: #1a252c; }
  .tog input { accent-color: var(--brass); }
  .boss { padding: 8px 16px; }
  .boss .bar { height: 5px; border-radius: 3px; background: var(--panel2); margin-top: 5px; overflow: hidden; }
  .boss .bar i { display: block; height: 100%; background: #ff6b5e; }
  .atbl { display: grid; grid-template-columns: 1fr 44px 44px 44px; gap: 2px 8px; padding: 6px 16px; align-items: center; }
  .atbl.h { color: var(--dim); font-size: 11.5px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1; padding-top: 8px; padding-bottom: 6px; }
  .atbl.h span { cursor: pointer; text-align: right; } .atbl.h span:first-child { text-align: left; cursor: default; }
  .atbl.r { border-bottom: 1px solid #1b262d; }
  .atbl.r .num { text-align: right; font: 600 13px var(--display); }
  .pen { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; padding: 0 4px; color: #0f1519; font: 700 12px var(--display); }
  .item { display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid #1b262d; }
  .item b { color: var(--text); font-weight: 600; }
  .warnTxt { color: #f29b50; }
  .item a { color: var(--brass); }
  input.noteinp { width: 100%; margin-top: 4px; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="head">
      <div class="brand"><h1>Tarkov Wayfinder</h1><small>fan tool, 1.0 and later</small></div>
      <div class="row"><select id="mapSel" aria-label="Map"></select></div>
      <div class="row">
        <div class="seg" role="group" aria-label="Your side"><button id="fPmc" class="on">PMC</button><button id="fScav">Scav</button></div>
        <label class="chk"><input type="checkbox" id="cTransit" checked>Transits</label>
        <label class="chk"><input type="checkbox" id="cSpawn">Spawns</label>
      </div>
      <div class="row" id="floors"></div>
      <div class="summary" id="summary"></div>
      <div class="row" id="timer"></div>
    </div>
    <div id="you"></div>
    <div class="tabs" role="tablist">
      <button id="tabEx" class="on" role="tab"></button>
      <button id="tabQ" role="tab"></button>
      <button id="tabL" role="tab"></button>
      <button id="tabI" role="tab"></button>
      <button id="tabA" role="tab"></button>
      <button id="tabM" role="tab"></button>
      <button id="tabH" role="tab"></button>
      <button id="tabN" role="tab"></button>
    </div>
    <div id="list"></div>
    <footer>
      Map art by Shebuka and the-hideout (<a href="https://github.com/the-hideout/tarkov-dev-svg-maps" target="_blank">CC BY-NC-SA 4.0</a>).
      Data from <a href="https://json.tarkov.dev" target="_blank">json.tarkov.dev</a>. Personal, non-commercial, not affiliated with Battlestate Games. Check extract conditions in raid.
    </footer>
  </aside>
  <main>
    <div id="map"></div>
    <details id="legend" open><summary>Legend</summary><ul id="legendList"></ul></details>
    <div id="scale"></div>
  </main>
</div>
<script src="/vendor/leaflet.js"></script>
<script src="/icons.js"></script>
<script src="/app.js"></script>
<script src="/tools.js"></script>
<script src="/items-tool.js"></script>
<script src="/hideout-tool.js"></script>
<script src="/inventory-tool.js"></script>
<script src="/inventory-ui.js"></script>
</body>
</html>
